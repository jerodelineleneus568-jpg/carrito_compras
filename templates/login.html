{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            <h4 class="fw-bold text-center mb-3">Iniciar Sesión</h4>
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="admin@tienda.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Ingresar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
